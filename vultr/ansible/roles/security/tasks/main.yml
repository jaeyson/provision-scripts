- name: Read the content of the generated public key from the remote host
  # The 'slurp' module reads a file from the remote host and returns
  # its content base64 encoded.
  ansible.builtin.slurp:
    src: "/home/{{ new_username }}/.ssh/id_ed25519.pub"
  register: securit_ssh_public_key_content # Stores the result in this variable
  become: true
  become_user: "{{ new_username }}"

- name: Add generated public key to authorized_keys using lineinfile for '{{ new_username }}'
  # This module ensures a specific line is present in a file.
  ansible.builtin.lineinfile:
    path: "/home/{{ new_username }}/.ssh/authorized_keys"
    line: "{{ security_ssh_public_key_content['content'] | b64decode }}" # Decodes the slurped content
    create: true # Create the file if it doesn't exist
    owner: "{{ new_username }}"
    group: "{{ new_username }}"
    mode: '0600' # Set appropriate permissions for authorized_keys
  become: true
  become_user: "{{ new_username }}" # Ensure this task runs as the new user to manage their file
