name: Deploy Actix-Web app

on:
  pull_request:
    branches: [main]

jobs:
  lint_workflow:
    uses: ./.github/workflows/lint.yml
  build:
    runs-on: ubuntu-latest
    needs: [lint_workflow]
    concurrency:
      group: deploy-group # optional: ensure only one action runs at a time

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # - name: Install Rust
    #   uses: actions-rs/toolchain@v1
    #   with:
    #     toolchain: stable
    #     profile: minimal
    #     override: true

    - name: Format check
      run: |
        cd vultr-actix-web/web_app &&
        cargo fmt -- --check

    - name: Lint with Clippy
      run: |
        cd vultr-actix-web/web_app &&
        cargo clippy -- -D warnings

    - name: Run tests
      run: |
        cd vultr-actix-web/web_app &&
        cargo test --verbose

    - name: Build
      run: |
        cd vultr-actix-web/web_app &&
        cargo build --release --verbose

    - name: Copy files via SSH
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: root
        password: ${{ secrets.PASSWORD }}
        port: 22
        source: "vultr-actix-web/web_app/target/release/web_app"
        target: /usr/local/bin/web_app

